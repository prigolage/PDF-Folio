<style>
/* Layout: a working desk — sticky tool bar, scrolling stack of white pages, inspector rail (bottom sheet on phones). */
@font-face { font-family: "Instrument Sans Folio"; src: url("fonts/InstrumentSans-Regular.ttf") format("truetype"); font-weight: 400 549; font-style: normal; font-display: swap; }
@font-face { font-family: "Instrument Sans Folio"; src: url("fonts/InstrumentSans-Bold.ttf") format("truetype"); font-weight: 550 800; font-style: normal; font-display: swap; }
@font-face { font-family: "Instrument Sans Folio"; src: url("fonts/InstrumentSans-Italic.ttf") format("truetype"); font-weight: 400 800; font-style: italic; font-display: swap; }
/* Folio: a quiet, precise frame around the document. One family (Instrument Sans), cobalt as the only accent. */
:root {
  --desk: #E6E8EC; --panel: #FAFAFB; --raise: #FFFFFF; --field: #F1F2F4; --ink: #16181D; --muted: #61666F; --faint: #8D929B;
  --line: #E2E4E8; --line-strong: #CFD2D8;
  --accent: #2E52E0; --accent-ink: #FFFFFF; --accent-soft: rgba(46,82,224,.09); --accent-hover: #2445C7;
  --mark: #C98400; --mark-soft: rgba(214,150,10,.16); --danger: #C2361F; --danger-soft: rgba(194,54,31,.08);
  --paper: #FFFFFF; --mark-fold: #FFFFFF;
  --shadow: 0 0 0 1px rgba(17,22,34,.05), 0 1px 2px rgba(17,22,34,.06), 0 14px 34px -10px rgba(17,22,34,.24);
  --shadow-pop: 0 0 0 1px rgba(17,22,34,.07), 0 16px 40px -8px rgba(17,22,34,.28);
  --shadow-btn: 0 1px 1px rgba(17,22,34,.05);
  --sel: #2E52E0; --sel-soft: rgba(46,82,224,.10); --box: rgba(80,92,110,.18);
  --diff-add: rgba(232,163,8,.34); --diff-del: rgba(214,48,39,.22); --diff-del-line: #B42318;
  --f-ui: "Instrument Sans", "Instrument Sans Folio", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-brand: var(--f-ui); --f-data: var(--f-ui);
  --r-sm: 6px; --r: 8px; --r-lg: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #0C0D10; --panel: #15171B; --raise: #1C1F24; --field: #22252B; --ink: #ECEEF1; --muted: #9CA2AC; --faint: #737984;
  --line: #262A31; --line-strong: #343943;
  --accent: #7C94FF; --accent-ink: #0B1026; --accent-soft: rgba(124,148,255,.14); --accent-hover: #93A7FF;
  --mark: #F0B429; --mark-soft: rgba(240,180,41,.20); --danger: #FF7A66; --danger-soft: rgba(255,122,102,.12);
  --paper: #FFFFFF; --mark-fold: #15171B;
  --shadow: 0 0 0 1px rgba(0,0,0,.4), 0 18px 40px -12px rgba(0,0,0,.7); --shadow-pop: 0 0 0 1px rgba(255,255,255,.06), 0 18px 44px -8px rgba(0,0,0,.7); --shadow-btn: none;
  --sel: #4C6EF5; --sel-soft: rgba(76,110,245,.14); --box: rgba(80,92,110,.13); --diff-del-line: #FF7A66; color-scheme: dark } }
:root[data-theme="dark"] {
  --desk: #0C0D10; --panel: #15171B; --raise: #1C1F24; --field: #22252B; --ink: #ECEEF1; --muted: #9CA2AC; --faint: #737984;
  --line: #262A31; --line-strong: #343943;
  --accent: #7C94FF; --accent-ink: #0B1026; --accent-soft: rgba(124,148,255,.14); --accent-hover: #93A7FF;
  --mark: #F0B429; --mark-soft: rgba(240,180,41,.20); --danger: #FF7A66; --danger-soft: rgba(255,122,102,.12);
  --paper: #FFFFFF; --mark-fold: #15171B;
  --shadow: 0 0 0 1px rgba(0,0,0,.4), 0 18px 40px -12px rgba(0,0,0,.7); --shadow-pop: 0 0 0 1px rgba(255,255,255,.06), 0 18px 44px -8px rgba(0,0,0,.7); --shadow-btn: none;
  --sel: #4C6EF5; --sel-soft: rgba(76,110,245,.14); --box: rgba(80,92,110,.13); --diff-del-line: #FF7A66; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--f-ui); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- tool bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 200px; }
.brand b { font-family: var(--f-brand); font-weight: 600; font-size: 18px; letter-spacing: .01em; white-space: nowrap; }
.brand b i { font-style: normal; color: var(--accent); }
.doc-name { font-family: var(--f-data); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.group { display: flex; align-items: center; gap: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--raise); }
.seg button { border: 0; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--raise); padding: 6px 10px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; border-color: var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.icon { padding: 6px 8px; }
.btn.danger { color: var(--danger); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.zoom-val { font-family: var(--f-data); font-size: 12px; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 2px; }

/* ---------- workspace ---------- */
.work { flex: 1; min-height: 0; display: flex; }
#desk { flex: 1; min-width: 0; overflow: auto; position: relative; }
#pages { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-block: 24px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: min-content; }
.page { position: relative; background: var(--paper); box-shadow: var(--shadow); flex: none; }
.page canvas { display: block; width: 100%; height: 100%; }
.page .num { position: absolute; left: 0; top: -18px; font-family: var(--f-data); font-size: 11px; color: var(--muted); }
.page .busy { position: absolute; inset: 0; display: grid; place-items: center; color: #8A989E; font-family: var(--f-data); font-size: 12px; }
.ov { position: absolute; inset: 0; }
.mode-addtext .ov, .mode-addimage .ov { cursor: crosshair; }
.hit { position: absolute; border-radius: 2px; cursor: text; }
.mode-edit .hit:hover { outline: 1px solid var(--sel); }
.hit.changed { box-shadow: inset 0 -2px 0 var(--mark); background: var(--mark-soft); }
.hit.hidden-by-edit { pointer-events: none; }
.mode-addtext .hit, .mode-addimage .hit, .mode-addtext .imgbox, .mode-addimage .imgbox, .mode-addtext .added, .mode-addimage .added { pointer-events: none; }
.imgbox { position: absolute; cursor: pointer; }
.mode-edit .imgbox { outline: 1px solid var(--box); }
.mode-edit .imgbox:hover { outline: 1px solid var(--sel); }
.imgbox.changed { outline: 2px solid var(--mark); outline-offset: -1px; }
.imgbox.deleted { outline: 1px dashed var(--danger); background: repeating-linear-gradient(45deg, var(--danger-soft) 0 6px, transparent 6px 12px); }
.imgbox.deleted::after { content: "Deleted"; position: absolute; left: 4px; top: 4px; font-family: var(--f-data); font-size: 10px; color: #B42318; background: #fff; padding: 1px 4px; border-radius: 3px; }
.added { position: absolute; cursor: move; }
.added.txt { outline: 1px dashed transparent; }
.mode-edit .added { outline: 1px solid var(--box); }
.mode-edit .added:hover { outline: 1px solid var(--sel); }
.sel { outline: 1px solid var(--sel) !important; outline-offset: 1px; }
.hit.blk { border-radius: 3px; }
.mode-edit .hit.blk.sel, .mode-edit .hit.blk.insel { cursor: move; }
.mode-edit .hit.blk { outline: 1px solid var(--box); outline-offset: 1px; }
.mode-edit .hit.blk:hover { outline-color: var(--sel); }
.hit.blk.changed { box-shadow: none; background: transparent; outline: 1px dashed var(--mark); outline-offset: 1px; }
.hit.blk.deleted { outline: 1px dashed var(--danger); background: repeating-linear-gradient(45deg, var(--danger-soft) 0 5px, transparent 5px 10px); }
.insel { outline: 1px solid var(--sel) !important; outline-offset: 1px; }
.pre { outline: 1px solid var(--sel) !important; outline-offset: 1px; background: var(--sel-soft); }
.marquee { position: absolute; border: 1px dashed var(--sel); background: var(--sel-soft); pointer-events: none; z-index: 2; }
.lifting { z-index: 2; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.ghost { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .92; }
.lift-mask { position: absolute; background: var(--paper); opacity: .8; pointer-events: none; }
.dragging .ov { cursor: move; }
.inline-edit.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.changes .tag { color: var(--muted); font-size: 12px; }
.changes .quote { color: var(--ink); }
.xy { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.xy input { font-family: var(--f-data); font-size: 12px; font-variant-numeric: tabular-nums; }
.handle { position: absolute; width: 9px; height: 9px; background: #fff; border: 1px solid var(--sel); right: -5px; bottom: -5px; cursor: nwse-resize; touch-action: none; }
.inline-edit { position: absolute; z-index: 3; background: var(--paper); color: #111; border: 1px solid var(--sel); border-radius: 0; padding: 0 2px; margin: 0; caret-color: var(--sel);
  line-height: 1.15; min-width: 40px; outline: none; resize: none; overflow: hidden; white-space: pre; }
.inline-edit.err { border-color: #B42318; }

/* ---------- inspector ---------- */
#inspector { width: 300px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; display: flex; flex-direction: column; }
.insp-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.insp-head h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; flex: 1; }
.insp-body { padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.sheet-toggle { display: none; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field textarea, .field input[type=text], .field input[type=number], .field select { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; width: 100%; min-width: 0; }
.field textarea { min-height: 64px; resize: vertical; font-family: var(--f-ui); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.row > .field { flex: 1 1 70px; }
.xywh { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.xywh input { font-family: var(--f-data); font-size: 12px; font-variant-numeric: tabular-nums; }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toggle-b { min-width: 34px; justify-content: center; font-weight: 700; }
.toggle-b.i { font-style: italic; font-weight: 400; font-family: Georgia, serif; }
.toggle-b[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
input[type=color] { width: 40px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); cursor: pointer; }
.orig { font-family: var(--f-data); font-size: 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; color: var(--muted); overflow-wrap: anywhere; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.note.warn { color: var(--ink); background: var(--mark-soft); border-radius: 6px; padding: 8px 10px; }
.note.bad { color: var(--danger); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.changes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.changes li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: start; padding: 8px 6px; border-radius: 6px; cursor: pointer; }
.changes li:hover { background: var(--accent-soft); }
.changes .pg { font-family: var(--f-data); font-size: 11px; color: var(--muted); padding-top: 2px; }
.changes .what { min-width: 0; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
.changes del { color: var(--muted); text-decoration-color: var(--danger); }
.changes ins { text-decoration: none; background: var(--mark-soft); padding: 0 2px; border-radius: 2px; }
.changes .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.changes .x:hover { color: var(--danger); background: var(--danger-soft); }
.empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
.kbd { font-family: var(--f-data); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--raise); }
.how { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; line-height: 1.45; }

/* ---------- banners, drop, toast ---------- */
.banner { margin: 0 auto; max-width: 760px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.banner span { flex: 1 1 240px; color: var(--muted); }
#drop { position: absolute; inset: 0; background: var(--accent-soft); border: 3px dashed var(--accent); display: grid; place-items: center; font-weight: 600; color: var(--accent); z-index: 4; pointer-events: none; }
#toast { pointer-events: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--desk); padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.status { font-family: var(--f-data); font-size: 11px; color: var(--muted); white-space: nowrap; }

@media (max-width: 860px) {
  .bar { gap: 8px; }
  .brand { flex-basis: 100%; }
  .lbl-sm { display: none; }
  #inspector { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 55vh; border-left: 0; border-top: 1px solid var(--line); z-index: 6;
    box-shadow: 0 -8px 24px rgba(0,0,0,.18); border-radius: 12px 12px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  #inspector.collapsed .insp-body { display: none; }
  .sheet-toggle { display: inline-flex; }
}
@media (prefers-reduced-motion: no-preference) { .seg button, .btn { transition: background .12s, border-color .12s; } }

/* ---------- pages view ---------- */
.pages-bar { position: sticky; top: 0; z-index: 3; background: var(--desk); padding-block: 12px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); }
.pages-bar .count { font-family: var(--f-data); font-size: 12px; color: var(--muted); margin-right: auto; white-space: nowrap; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; padding-block: 18px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.thumb { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; user-select: none; -webkit-user-select: none; min-width: 0; }
.thumb:hover { background: var(--accent-soft); }
.thumb.picked { border-color: var(--accent); background: var(--accent-soft); }
.thumb.dragging { opacity: .35; }
.thumb .tp { position: relative; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; }
.thumb .tp canvas { display: block; }
.thumb .meta { font-family: var(--f-data); font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.thumb .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mark); }
.thumb .src { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drop-mark { position: absolute; width: 3px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 4; }
#gridWrap { position: relative; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10,16,20,.45); z-index: 30; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); width: min(420px, 100%); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal h3 { margin: 0; font-size: 16px; text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 13.5px; }
.modal input[type=password] { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.modal .actions { justify-content: flex-end; }
.modal .err { color: var(--danger); font-size: 13px; }

/* ---------- review pane ---------- */
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
#splitter { flex: 0 0 9px; cursor: col-resize; background: var(--panel); border-inline: 1px solid var(--line); touch-action: none; position: relative; }
#splitter::after { content: ""; position: absolute; left: 3px; top: 50%; width: 1px; height: 32px; margin-top: -16px; box-shadow: 0 0 0 1px var(--muted); border-radius: 1px; }
#splitter:hover, #splitter:focus-visible { background: var(--accent-soft); }
#compare { flex: 0 0 var(--cmp-w, 42%); min-width: 0; display: flex; flex-direction: column; background: var(--desk); }
.cmp-bar { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.cmp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.cmp-row:first-child { flex: 1 1 100%; }
.cmp-title { font-family: var(--f-data); font-size: 12px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-bar select { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 220px; }
.cmp-count { font-family: var(--f-data); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
#cmpScroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
#cmpPages { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 24px 16px 120px; min-width: min-content; }
.difflayer { position: absolute; inset: 0; pointer-events: none; }
.dm { position: absolute; border-radius: 2px; mix-blend-mode: multiply; }
.dm.add { background: var(--diff-add); box-shadow: inset 0 -2px 0 var(--mark); }
.dm.del { background: var(--diff-del); box-shadow: inset 0 -2px 0 var(--diff-del-line); }
.dm.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.page.pg-added { box-shadow: 0 0 0 3px var(--mark), var(--shadow); }
.page.pg-removed { box-shadow: 0 0 0 3px var(--diff-del-line), var(--shadow); }

  /* ---------- page access ---------- */

  function analyzePage(L, doc, pageIndex, fontCache, aopts) {

    const N = (k) => L.PDFName.of(k);
    const streams = [];

    let posSinceShow = true;
    const cmyk2rgb = (c, m, y, k) => [(1 - c) * (1 - k), (1 - m) * (1 - k), (1 - y) * (1 - k)];

    function exec(si) {
      const S = streams[si];
      const fontsDict = S.res ? S.res.lookup(N('Font')) : null;
      const xobjDict = S.res ? S.res.lookup(N('XObject')) : null;
      let qd = 0;

        const f = gs.font || { twoByte: false, widthScale: 0.001, width: () => 500, baseFont: '', uni: c => String.fromCharCode(c), encodeMap: () => null };
        const glyphs = [];
        const startM = mul(Tm, gs.ctm);

          const el = elems[ei];
          if (typeof el === 'number') { Tm = mul([1, 0, 0, 1, -el / 1000 * gs.Tfs * gs.Th, 0], Tm); continue; }
          const step = f.twoByte ? 2 : 1;

            const code = f.twoByte ? ((el.charCodeAt(k) << 8) | (el.charCodeAt(k + 1) || 0)) : el.charCodeAt(k);
            const tx = (f.width(code) * f.widthScale * gs.Tfs + gs.Tc + (!f.twoByte && code === 32 ? gs.Tw : 0)) * gs.Th;
            const tm0 = Tm;
            const p0 = apply(mul(Tm, gs.ctm), 0, 0);
            Tm = mul([1, 0, 0, 1, tx, 0], Tm);
            const p1 = apply(mul(Tm, gs.ctm), 0, 0);
            glyphs.push({ el: ei, bytes: el.substr(k, step), adv: tx, p0, p1, tm: tm0, code, ch: f.uni ? f.uni(code) : String.fromCharCode(code) });

        }
        runs.push({
          si, opIndex, kind, glyphs, elems, font: f,
          Tfs: gs.Tfs, Th: gs.Th, Tc: gs.Tc, Tw: gs.Tw,
          baseFont: (f.baseFont || '').replace(/^[A-Z]{6}\+/, ''),
          fill: gs.fill.slice(), size: gs.Tfs * Math.hypot(startM[2], startM[3]),
          dir: Math.atan2(startM[1], startM[0]), sx: Math.hypot(startM[0], startM[1]) || 1,

        });

      };

      for (let oi = 0; oi < ops.length; oi++) {
        const o = ops[oi];
        const a = o.args.map(x => x.v);
        switch (o.op) {
          case 'q': qd++; gstack.push({ ...gs, ctm: gs.ctm.slice(), fill: gs.fill.slice(), stroke: gs.stroke.slice() }); break;
          case 'Q': qd = Math.max(0, qd - 1); if (gstack.length) gs = gstack.pop(); break;
          case 'cm': if (a.length === 6) gs.ctm = mul(a, gs.ctm); break;
          case 'BT': Tm = I.slice(); Tlm = I.slice(); posSinceShow = true; break;
          case 'Tf': setFont(a[0], a[1] || 0); break;
          case 'Tc': gs.Tc = a[0] || 0; break;
          case 'Tw': gs.Tw = a[0] || 0; break;
          case 'Tz': gs.Th = (a[0] == null ? 100 : a[0]) / 100; break;
          case 'TL': gs.TL = a[0] || 0; break;
          case 'Ts': gs.rise = a[0] || 0; break;
          case 'Td': td(a[0] || 0, a[1] || 0); break;
          case 'TD': gs.TL = -(a[1] || 0); td(a[0] || 0, a[1] || 0); break;
          case 'Tm': if (a.length === 6) { Tm = a.slice(); Tlm = a.slice(); } posSinceShow = true; break;
          case 'T*': td(0, -gs.TL); break;
          case 'Tj': showRun(oi, [a[0] || ''], 'Tj'); break;
          case 'TJ': showRun(oi, (a[0] || []).map(x => x.v), 'TJ'); break;
          case "'": td(0, -gs.TL); showRun(oi, [a[0] || ''], "'"); break;
          case '"': gs.Tw = a[0] || 0; gs.Tc = a[1] || 0; td(0, -gs.TL); showRun(oi, [a[2] || ''], '"'); break;
          case 'Tr': gs.Tr = a[0] || 0; break;
          case 'w': gs.lw = a[0] || 0; break;
          case 'G': gs.stroke = [a[0], a[0], a[0]]; break;
          case 'RG': gs.stroke = [a[0], a[1], a[2]]; break;
          case 'K': gs.stroke = cmyk2rgb(a[0], a[1], a[2], a[3]); break;
          case 'SC': case 'SCN': {
            const nums = a.filter(x => typeof x === 'number');
            if (nums.length === 1) gs.stroke = [nums[0], nums[0], nums[0]];
            else if (nums.length === 3) gs.stroke = nums.slice();
            else if (nums.length === 4) gs.stroke = cmyk2rgb.apply(null, nums);

          }
          case 'm': if (wantPaths && !path.length) pathStart = oi; if (wantPaths) { cur = [[apply(gs.ctm, a[0], a[1])]]; path.push(cur[0]); curve = false; } break;
          case 'l': if (wantPaths && path.length) path[path.length - 1].push(apply(gs.ctm, a[0], a[1])); break;
          case 'c': case 'v': case 'y': if (wantPaths && path.length) { const n = a.length; path[path.length - 1].push(apply(gs.ctm, a[n - 2], a[n - 1])); path[path.length - 1].curved = true; } break;
          case 'h': if (wantPaths && path.length) path[path.length - 1].closed = true; break;
          case 're': if (wantPaths && !path.length) pathStart = oi; if (wantPaths) { const [x, y, w, h] = a; const sp = [apply(gs.ctm, x, y), apply(gs.ctm, x + w, y), apply(gs.ctm, x + w, y + h), apply(gs.ctm, x, y + h)]; sp.closed = true; sp.rect = true; path.push(sp); } break;

            if (wantPaths && path.length && !clipNext) {
              const stroke = /^[SsBb]/.test(o.op), fill = o.op !== 'S' && o.op !== 's';
              const lw = gs.lw * Math.hypot(gs.ctm[0], gs.ctm[1]) || 0.5;
              const gi = graphics.length, first = shapes.length;
              for (const sp of path) {
                const xs = sp.map(p => p[0]), ys = sp.map(p => p[1]);
                const bb = { x: Math.min.apply(0, xs), y: Math.min.apply(0, ys) }; bb.w = Math.max.apply(0, xs) - bb.x; bb.h = Math.max.apply(0, ys) - bb.y;
                let kind = 'path';
                const axis = !sp.curved && sp.every((p, k) => { const q = sp[(k + 1) % sp.length]; return Math.abs(p[0] - q[0]) < 0.01 || Math.abs(p[1] - q[1]) < 0.01; });

                else if (axis && (sp.length === 4 || (sp.length === 5 && Math.abs(sp[0][0] - sp[4][0]) < 0.01 && Math.abs(sp[0][1] - sp[4][1]) < 0.01))) kind = 'rect';
                else if (!sp.curved && sp.length > 2 && sp.every((p, k) => k === 0 || Math.abs(p[0] - sp[0][0]) < 0.01 || Math.abs(p[1] - sp[0][1]) < 0.01) && (bb.w < 0.01 || bb.h < 0.01)) kind = 'line';
                shapes.push({ kind, pts: sp, bbox: bb, fill: fill ? gs.fill.slice() : null, stroke: stroke ? gs.stroke.slice() : null, lw, curved: !!sp.curved, si, g: gi });

              const mine = shapes.slice(first);
              if (pathStart >= 0 && mine.length) {
                const x0 = Math.min(...mine.map(m => m.bbox.x)), y0 = Math.min(...mine.map(m => m.bbox.y));
                const x1 = Math.max(...mine.map(m => m.bbox.x + m.bbox.w)), y1 = Math.max(...mine.map(m => m.bbox.y + m.bbox.h));

                  bbox: { x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad }, fill: fill ? gs.fill.slice() : null, stroke: stroke ? gs.stroke.slice() : null, lw: stroke ? lw : 0 });

          case 'g': gs.fill = [a[0], a[0], a[0]]; break;
          case 'rg': gs.fill = [a[0], a[1], a[2]]; break;
          case 'k': gs.fill = cmyk2rgb(a[0], a[1], a[2], a[3]); break;
          case 'sc': case 'scn': {
            const nums = a.filter(x => typeof x === 'number');
            if (nums.length === 1) gs.fill = [nums[0], nums[0], nums[0]];

  /* ---------- matching edit boxes to glyphs ---------- */
  // box: { origin:[x,y], dir:[dx,dy] (unit), width, height } in user space
  function glyphsInBox(analysis, box) {
    const hits = [];
    const [ox, oy] = box.origin, [dx, dy] = box.dir;
    const h = box.height || 10;
    for (let ri = 0; ri < analysis.runs.length; ri++) {
      const r = analysis.runs[ri];
      for (let gi = 0; gi < r.glyphs.length; gi++) {
        const g = r.glyphs[gi];
        const mx = (g.p0[0] + g.p1[0]) / 2 - ox, my = (g.p0[1] + g.p1[1]) / 2 - oy;
        const u = mx * dx + my * dy;
        const v = -mx * dy + my * dx;

        if (u >= -tolU && u <= box.width + tolU && v >= -h * 0.45 && v <= h * 0.85) hits.push([ri, gi, u]);
      }
    }
    return hits;
  }

  const proj = (p, box) => (p[0] - box.origin[0]) * box.dir[0] + (p[1] - box.origin[1]) * box.dir[1];

  /* decode the text under a box into units (one per glyph, plus virtual spaces for gaps) */
  function boxText(analysis, box) {
    const hits = glyphsInBox(analysis, box).sort((x, y) => x[2] - y[2]);
    const units = [];
    let prev = null;
    for (const [ri, gi] of hits) {
      const run = analysis.runs[ri], g = run.glyphs[gi];
      if (prev) {
        const gap = proj(g.p0, box) - proj(prev.g.p1, box);
        if (gap > Math.max(prev.run.size, run.size) * 0.18 && prev.g.ch !== ' ' && g.ch !== ' ')
          units.push({ ch: ' ', virtual: true, p0: prev.g.p1, p1: g.p0 });
      }
      units.push({ ch: g.ch, ri, gi, p0: g.p0, p1: g.p1 });
      prev = { run, g };
    }
    // edge spaces usually belong to neighbouring text that brushes the box: leave them alone
    while (units.length && /^\s+$/.test(units[0].ch)) units.shift();
    while (units.length && /^\s+$/.test(units[units.length - 1].ch)) units.pop();
    const keep = new Set(units.filter(u => !u.virtual).map(u => u.ri + ':' + u.gi));
    const text = units.map(u => u.ch).join('');
    return { units, text, hits: hits.filter(h => keep.has(h[0] + ':' + h[1])) };
  }

  function dominantRun(analysis, refs) {
    const count = new Map();
    refs.forEach(([ri]) => count.set(ri, (count.get(ri) || 0) + 1));
    let best = null, bc = -1;
    count.forEach((c, ri) => { if (c > bc) { bc = c; best = ri; } });
    return best == null ? null : analysis.runs[best];
  }

  function styleFromRun(run, fallbackSize) {
    if (!run) return { family: 'Helvetica', bold: false, italic: false, size: fallbackSize || 11, color: [0, 0, 0] };
    const st = styleOf(run.baseFont);
    return { family: familyOf(run.baseFont), bold: st.bold, italic: st.italic, size: run.size || fallbackSize || 11, color: run.fill.slice() };
  }

  /*
   * Plan a text edit. Only the characters that changed are removed. When the PDF's own
   * font has every new character, they are written into the original text run so the
   * result is typographically identical; otherwise they are drawn in a matching font.
   * Text after the change shifts when the replacement is longer or shorter.
   * measure(text, style) -> width in user space units (for drawn text)
   */
  function planTextEdit(analysis, box, newText, opts) {
    opts = opts || {};
    const bt = boxText(analysis, box);
    const angle = Math.atan2(box.dir[1], box.dir[0]);
    const norm = (t) => (t || '').replace(/\s+/g, '');
    const reliable = bt.units.length > 0 && bt.text.indexOf('\ufffd') < 0 && (opts.originalText == null || norm(bt.text) === norm(opts.originalText));
    const plan = { removed: [], desired: new Map(), draw: null, insert: null, mode: 'none', decoded: bt.text };
    if (!bt.units.length) {
      plan.mode = 'cover';
      const st = Object.assign(styleFromRun(null, box.height), opts.style || {});
      if (newText) plan.draw = Object.assign({ text: newText, x: box.origin[0], y: box.origin[1], angle }, st);
      return plan;
    }
    if (!reliable || opts.whole) {
      plan.mode = 'whole';
      plan.removed = bt.hits.map(h => [h[0], h[1]]);
      const st = Object.assign(styleFromRun(dominantRun(analysis, plan.removed), box.height), opts.style || {});
      if (newText) plan.draw = Object.assign({ text: newText, x: box.origin[0], y: box.origin[1], angle }, st);
      return plan;
    }
    const U = bt.units, n = U.length;
    let p = 0, pc = 0;
    while (p < n && newText.substr(pc, U[p].ch.length) === U[p].ch) { pc += U[p].ch.length; p++; }
    let sfx = 0, sc = 0;
    while (sfx < n - p) {
      const ch = U[n - 1 - sfx].ch;
      if (newText.length - sc - ch.length < pc) break;
      if (newText.substr(newText.length - sc - ch.length, ch.length) !== ch) break;
      sc += ch.length; sfx++;
    }
    const removedUnits = U.slice(p, n - sfx);
    const inserted = newText.slice(pc, newText.length - sc);
    if (!removedUnits.length && !inserted) return plan;
    plan.mode = 'diff';
    const realRemoved = removedUnits.filter(u => !u.virtual);
    plan.removed = realRemoved.map(u => [u.ri, u.gi]);
    let anchor, removedW = 0;
    if (removedUnits.length) {
      anchor = removedUnits[0].p0;
      removedW = proj(removedUnits[removedUnits.length - 1].p1, box) - proj(anchor, box);
    } else anchor = p > 0 ? U[p - 1].p1 : U[0].p0;
    let newW = 0;
    // 1) write into the original run with the original font
    let host = null;
    if (realRemoved.length) host = { ri: realRemoved[0].ri, gi: realRemoved[0].gi, where: 'before' };
    else if (p > 0 && !U[p - 1].virtual) host = { ri: U[p - 1].ri, gi: U[p - 1].gi, where: 'after' };
    else if (p > 1 && U[p - 1].virtual && !U[p - 2].virtual) host = null; // gap: draw instead
    else if (p === 0 && !U[0].virtual) host = { ri: U[0].ri, gi: U[0].gi, where: 'before' };
    if (inserted && host && !opts.style && !opts.noReuse) {
      const run = analysis.runs[host.ri];
      const enc = encodeInRun(run, inserted);
      if (enc) {
        plan.insert = Object.assign(host, { parts: enc.parts, adv: enc.adv });
        newW = enc.adv * run.sx;
        plan.mode = 'reuse';
      }
    }
    // 2) otherwise draw the new characters
    if (inserted && !plan.insert) {
      const srcUnit = realRemoved[0] || [U[p - 1], U[p], U[p - 2], U[p + 1]].find(u => u && !u.virtual);
      const st = Object.assign(styleFromRun(srcUnit ? analysis.runs[srcUnit.ri] : null, box.height), opts.style || {});
      plan.draw = Object.assign({ text: inserted, x: anchor[0], y: anchor[1], angle }, st);
      newW = opts.measure ? opts.measure(inserted, st) : 0;
    }
    const delta = newW - removedW;
    if (sfx > 0 && Math.abs(delta) > 0.01) U.slice(n - sfx).forEach(u => { if (!u.virtual) plan.desired.set(u.ri + ':' + u.gi, delta); });
    return plan;
  }

  /* encode text in a run's own font; spaces the font lacks become positioning */
  function encodeInRun(run, text) {
    const f = run.font;
    if (!f || !f.encodeMap) return null;
    const m = f.encodeMap();
    if (!m || !m.size) return null;
    const parts = [];
    let adv = 0;
    for (const ch of text) {
      const code = m.get(ch);
      if (code == null) {
        if (ch === ' ') { const a = 0.28 * run.Tfs * run.Th; parts.push({ adv: a }); adv += a; continue; }
        return null;
      }
      if (ch !== ' ' && !(f.width(code) > 0)) return null;

        if (ri == null) { for (let k = j + 1; k < newText.length; k++) if (match[k] >= 0) { ri = runOf(match[k]); break; } }
        if (ri == null) ri = runOf(0);
        chars.push({ ch: newText[j], ri });
      }
    }
    const st = edit.style || null;
    const widthOf = (ch, ri) => {
      const r = ri != null ? an.runs[ri] : null;
      if (!st && r && r.font && r.font.encodeMap) {
        const m = r.font.encodeMap(); const code = m && m.get(ch);
        if (code != null && (ch === ' ' || r.font.width(code) > 0)) return { own: true, code, w: r.font.width(code) * r.font.widthScale * r.Tfs * r.Th * r.sx };
        if (ch === ' ' && m) return { own: true, space: true, w: 0.28 * r.Tfs * r.Th * r.sx };
      }
      const sty = Object.assign(styleFromRun(r, block.size), st || {});
      return { own: false, w: opts.measure ? opts.measure(ch, sty) : sty.size * 0.55, sty };
    };
    const measured = chars.map(x => ({ ...x, ...widthOf(x.ch, x.ri) }));
    // wrap at word boundaries within the block's width
    const width = width0 != null ? width0 : Math.max(block.u1 - block.u0, opts.minWidth || 0);
    const firstIndent = block.lines[0].u0 - block.u0;
    const outLines = [];
    let line = [], lw = 0;
    const avail = () => width - (outLines.length === 0 ? firstIndent : 0);
    let i = 0;
    while (i < measured.length) {
      const m = measured[i];
      if (m.ch === '\n') { line.hard = true; outLines.push(line); line = []; lw = 0; i++; continue; }
      // a word with its following space
      let j = i; while (j < measured.length && measured[j].ch !== ' ' && measured[j].ch !== '\n') j++;
      let k = j; while (k < measured.length && measured[k].ch === ' ') k++;
      const word = measured.slice(i, j), spaces = measured.slice(j, k);
      const ww = word.reduce((a, b) => a + b.w, 0);
      if (line.length && lw + ww > avail() + 0.5) { while (line.length && line[line.length - 1].ch === ' ') line.pop(); outLines.push(line); line = []; lw = 0; }
      if (!line.length && ww > avail() + 0.5) {
        // a word longer than the line: break it
        for (const w of word) { if (line.length && lw + w.w > avail() + 0.5) { outLines.push(line); line = []; lw = 0; } line.push(w); lw += w.w; }
      } else { word.forEach(w => line.push(w)); lw += ww; }
      spaces.forEach(sp => { line.push(sp); lw += sp.w; });
      i = k;
    }
    while (line.length && line[line.length - 1].ch === ' ') line.pop();
    outLines.push(line);
    const gap = block.lines.length > 1 ? block.gap : block.size * 1.2;
    outLines.forEach((ln, li) => {
      let total = ln.reduce((a, b) => a + b.w, 0);
      if (block.align === 'justify' && li < outLines.length - 1 && !ln.hard) {
        const spaces = ln.filter(x => x.ch === ' ');
        const extra = (width - (li === 0 ? firstIndent : 0)) - total;
        if (spaces.length && extra > 0 && extra < width * 0.35) { ln.forEach((x, k) => { if (x.ch === ' ') ln[k] = { ...x, w: x.w + extra / spaces.length, space: true, own: x.own }; }); total += extra; }
      }
      let u = block.u0 + (li === 0 ? firstIndent : 0);
      if (block.align === 'center') u = block.u0 + width / 2 - total / 2;
      const v = block.lines[0].v - li * gap;
      // consecutive characters drawn the same way form one piece
      let k = 0;
      while (k < ln.length) {
        const a = ln[k];
        let e = k + 1;
        while (e < ln.length && ln[e].own === a.own && ln[e].ri === a.ri && !ln[e].space === !a.space && !(a.space || ln[e].space)) e++;
        const piece = ln.slice(k, e);
        const [x, y] = X(u, v);
        if (a.own && !a.space) {
          const r = an.runs[a.ri];
          const g0 = r.glyphs[0];
          const A = mul(g0.tm, r.ctm);
          const M = [A[0], A[1], A[2], A[3], x + dx, y + dy];
          const sx = Math.hypot(M[0], M[1]) || 1;
          let off = 0;
          const glyphs = piece.map(pc => { const bytes = r.font.twoByte ? String.fromCharCode((pc.code >> 8) & 255, pc.code & 255) : String.fromCharCode(pc.code & 255); const g = { bytes, code: pc.code, x: off / sx }; off += pc.w; return g; });
          plan.glyphItems.push({ run: r, M, glyphs });
        } else if (!a.own && !a.space) {
          const sty = a.sty;
          plan.draws.push(Object.assign({ text: piece.map(pc => pc.ch).join(''), x: x + dx, y: y + dy, angle: block.angle }, sty));
        }
        u += piece.reduce((s2, pc) => s2 + pc.w, 0);
        k = e;
      }
    });
    plan.lines = outLines.length;
    return plan;
  }

  /* ---------- applying one page's edits ---------- */
  async function applyPageEdits(L, doc, page, pi, pe, ctx) {
    const { fc, uni, font, embedImg, report } = ctx;
    const an = analyzePage(L, doc, pi, fc, { paths: (pe.blocks || []).length > 0 || (pe.graphics || []).length > 0 });
    // images: embed replacements and name them in the stream that draws them
    const imgEdits = [], extraX = new Map(), taken = new Set();
    for (const ie of (pe.images || [])) {
      const e = { id: ie.id, action: ie.action, rect: ie.rect, stretch: ie.stretch };
      if (ie.action === 'replace' && ie.file) {
        const img = an.images.find(x => x.id === ie.id);
        if (!img) continue;
        const emb = await embedImg(ie.file);
        e.newName = uniqueName(L, an.streams[img.si].res, 'ImgEd', taken);
        e.imgW = emb.width; e.imgH = emb.height;
        if (!extraX.has(img.si)) extraX.set(img.si, {});
        extraX.get(img.si)[e.newName] = emb.ref;
      }
      imgEdits.push(e);
    }
    // text: prepare unicode text first so its width is known when planning
    const texts = pe.text || [];
    const preps = new Map();
    const measure = (t, st) => {
      if (!uni.needed(t)) return measureStd(L, t, st);
      const p = preps.get(t + '|' + !!st.bold);
      return p ? uni.widthOf(p, st.size) : t.length * st.size * 0.6;
    };
    const plans = [];
    for (const t of texts) {
      let plan = planTextEdit(an, t.box, t.newText || '', { originalText: t.originalText, style: t.style, whole: t.whole, measure, noReuse: t.noReuse });
      if (plan.draw && uni.needed(plan.draw.text) && !preps.has(plan.draw.text + '|' + !!plan.draw.bold)) {
        preps.set(plan.draw.text + '|' + !!plan.draw.bold, await uni.prepare(plan.draw.text, !!plan.draw.bold));
        plan = planTextEdit(an, t.box, t.newText || '', { originalText: t.originalText, style: t.style, whole: t.whole, measure, noReuse: t.noReuse });
      }
      plans.push(plan);
    }
    // text blocks (paragraphs): edit in place, rewrap or move
    const blockPlans = [];
    if ((pe.blocks || []).length) {
      const blocks = buildBlocks(an);
      const styleOf = (b, li) => styleFromRun(an.runs[(b.units.find(u => u.line === li && u.ri != null) || b.units.find(u => u.ri != null) || {}).ri], b.size);
      for (const be of pe.blocks) {
        const b = blocks[be.index];
        if (!b || (be.originalText != null && be.originalText !== b.text)) { report.stale = (report.stale || 0) + 1; continue; }
        let bp = planBlockEdit(an, b, be, { measure, styleOf });
        const needs = (bp.draws || []).filter(d => uni.needed(d.text) && !preps.has(d.text + '|' + !!d.bold));
        for (const d of needs) preps.set(d.text + '|' + !!d.bold, await uni.prepare(d.text, !!d.bold));
        if (needs.length) bp = planBlockEdit(an, b, be, { measure, styleOf });
        blockPlans.push(bp);
        report.blocks = (report.blocks || 0) + 1;
      }
    }
    const gEdits = (pe.graphics || []).filter(ge => { const g = an.graphics[ge.index]; if (!g || (ge.sig && ge.sig !== graphicSig(g))) { report.stale = (report.stale || 0) + 1; return false; } return true; });
    report.graphics = (report.graphics || 0) + gEdits.length;
    const rw = rewriteContent(an, { text: plans.concat(blockPlans), images: imgEdits, graphics: gEdits });
    materialize(L, doc, page, an, rw.repl, extraX);
    report.pages[pi] = { removedGlyphs: rw.removedGlyphs, modes: plans.map(p => p.mode), blockModes: blockPlans.map(p => p.mode) };
    blockPlans.forEach(p => { if (p.mode === 'reuse') report.reused++; });
    let extra = '';
    plans.forEach((plan, i) => {
      if (plan.mode === 'whole') report.wholeLine++;
      if (plan.mode === 'reuse') report.reused++;
      if (plan.mode !== 'cover') return;
      const b = texts[i].box;
      report.coveredOnly++;
      const nx = -b.dir[1], ny = b.dir[0];
      page.drawRectangle({
        x: b.origin[0] - nx * b.height * 0.25, y: b.origin[1] - ny * b.height * 0.25,
        width: b.width, height: b.height * 1.15, color: L.rgb(1, 1, 1),
        rotate: L.radians(Math.atan2(b.dir[1], b.dir[0]))
      });
    });
    const draw = async (d) => {
      if (!d || !d.text) return;
      if (uni.needed(d.text)) {
        const key = d.text + '|' + !!d.bold;
        const prep = preps.get(key) || await uni.prepare(d.text, !!d.bold);
        prep.missing.forEach(ch => report.missingChars.add(ch));
        extra += uni.ops(page, prep, d);
        report.unicode++;
        return;
      }
      const f = await font(stdName(L, d.family, d.bold, d.italic));
      page.drawText(d.text, { x: d.x, y: d.y, size: d.size, font: f, color: L.rgb(d.color[0], d.color[1], d.color[2]), rotate: L.radians(d.angle || 0) });
    };
    for (const plan of plans) await draw(plan.draw);
    const fontNames = new Map();
    for (const bp of blockPlans) {
      for (const d of (bp.draws || [])) await draw(d);
      for (const it of (bp.glyphItems || [])) extra += glyphItemOps(L, doc, page, it, fontNames);
    }
    for (const t of (pe.addText || [])) {
      if (!t.text) continue;
      const a = t.angle || 0;
      const lines = t.text.split('\n');
      for (let k = 0; k < lines.length; k++) {
        await draw({ text: lines[k], x: t.x + Math.sin(a) * k * t.size * 1.2, y: t.y - Math.cos(a) * k * t.size * 1.2, size: t.size, family: t.family, bold: t.bold, italic: t.italic, color: t.color, angle: a });
      }
    }
    for (const ai of (pe.addImages || [])) {
      const emb = await embedImg(ai.file);
      page.drawImage(emb, { x: ai.rect.x, y: ai.rect.y, width: ai.rect.w, height: ai.rect.h });
    }
    if (extra) page.node.addContentStream(doc.context.register(doc.context.flateStream(extra)));
  }

  /* ---------- watermark ---------- */
  // "1-3, 5, 8-" style page ranges, 1-based; empty means every page
  function pageSet(spec, n) {
    const out = new Set();
    const t = String(spec || '').trim();
    if (!t) { for (let i = 0; i < n; i++) out.add(i); return out; }
    for (const part of t.split(/[,;\s]+/)) {
      const m = /^(\d*)\s*-\s*(\d*)$/.exec(part);
      if (m) { const a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : n; for (let i = Math.max(1, a); i <= Math.min(n, b); i++) out.add(i - 1); }
      else if (/^\d+$/.test(part) && +part >= 1 && +part <= n) out.add(+part - 1);
    }
    return out;
  }
  /*
   * Where the watermark text goes on a page. box: the visible page box in user space; rot: the
   * page's /Rotate; wm.angle is the slant the reader sees (counter-clockwise). widthAt1: text width
   * at size 1. Returns baseline origins in user space with the drawing angle.
   */
  function watermarkPlacements(box, rot, wm, widthAt1) {
    const r = ((rot % 360) + 360) % 360;
    const view = r % 180 ? { w: box.height, h: box.width } : { w: box.width, h: box.height };
    const th = ((wm.angle || 0) + r) * Math.PI / 180, ta = (wm.angle || 0) * Math.PI / 180;
    const capH = 0.72;
    let size = wm.size || 48;
    if (wm.fit !== false && (wm.layout || 'center') === 'center') {
      const c = Math.abs(Math.cos(ta)), sn = Math.abs(Math.sin(ta));
      size = Math.min(0.82 * view.w / (widthAt1 * c + capH * sn || 1), 0.82 * view.h / (widthAt1 * sn + capH * c || 1));
      size = Math.max(6, Math.min(size, 400));
    }
    const w = widthAt1 * size, h = capH * size;
    const cx = box.x + box.width / 2, cy = box.y + box.height / 2;
    const dx = Math.cos(th), dy = Math.sin(th);
    const origin = (x, y) => ({ x: x - dx * w / 2 + dy * h / 2, y: y - dy * w / 2 - dx * h / 2 });
    const out = [];
    if ((wm.layout || 'center') === 'tile') {
      const stepX = w + size * 2.2, stepY = h + size * 3.2;
      const R = Math.hypot(box.width, box.height) / 2 + Math.max(w, h);
      // a grid in the text's own direction, kept to the page
      for (let j = -Math.ceil(R / stepY), row = 0; j <= Math.ceil(R / stepY); j++, row++) {
        for (let i = -Math.ceil(R / stepX) - 1; i <= Math.ceil(R / stepX) + 1; i++) {
          const u = i * stepX + (row % 2 ? stepX / 2 : 0), v = j * stepY;
          const x = cx + u * dx - v * dy, y = cy + u * dy + v * dx;
          if (x < box.x - w / 2 || x > box.x + box.width + w / 2 || y < box.y - w / 2 || y > box.y + box.height + w / 2) continue;
          out.push({ ...origin(x, y), angle: th, size });
        }
      }
    } else out.push({ ...origin(cx, cy), angle: th, size });
    return out;
  }
  async function applyWatermark(L, doc, page, wm, ctx) {
    const text = String(wm.text).replace(/\s+/g, ' ').trim();
    if (!text) return;
    const box = page.getCropBox ? page.getCropBox() : page.getMediaBox();
    const rot = page.getRotation().angle || 0;
    const color = wm.color || [0.75, 0.1, 0.1];
    const uniNeeded = ctx.uni.needed(text);
    let widthAt1, emitText;
    if (uniNeeded) {
      const prep = await ctx.uni.prepare(text, !!wm.bold);
      prep.missing.forEach(ch => ctx.report.missingChars.add(ch));
      widthAt1 = ctx.uni.widthOf(prep, 1);
      emitText = (pl) => ctx.uni.ops(page, prep, { x: pl.x, y: pl.y, size: pl.size, color, angle: pl.angle });
    } else {
      const f = await ctx.font(stdName(L, wm.family || 'Helvetica', wm.bold !== false, !!wm.italic));
      widthAt1 = f.widthOfTextAtSize(text, 1);
      const fname = page.node.newFontDictionary('Wm', f.ref).decodeText();
      const hex = f.encodeText(text).toString();
      emitText = (pl) => { const c = Math.cos(pl.angle), sn = Math.sin(pl.angle); return 'BT /' + fname + ' ' + num(pl.size) + ' Tf ' + [c, sn, -sn, c, pl.x, pl.y].map(num).join(' ') + ' Tm ' + hex + ' Tj ET\n'; };
    }
    const op = Math.max(0.03, Math.min(1, wm.opacity == null ? 0.3 : wm.opacity));
    const gs = doc.context.register(doc.context.obj({ Type: 'ExtGState', ca: op, CA: op }));
    const gsName = page.node.newExtGState('WmGS', gs).decodeText();
    let ops = 'q /' + gsName + ' gs ' + color.map(num).join(' ') + ' rg\n';
    for (const pl of watermarkPlacements(box, rot, wm, widthAt1)) ops += emitText(pl);
    ops += 'Q\n';
    const stream = doc.context.register(doc.context.flateStream(ops));
    const list = contentRefs(L, page);
    if (wm.layer === 'behind') {
      page.node.set(L.PDFName.of('Contents'), doc.context.obj([stream, ...list]));
    } else {
      // keep whatever state the page leaves behind from reaching the watermark
      let depth = 0;
      try { for (const o of parseOps(pageContent(L, doc, page))) { if (o.op === 'q') depth++; else if (o.op === 'Q') depth = Math.max(0, depth - 1); } } catch (e) { depth = 0; }
      const pre = doc.context.register(doc.context.flateStream('q\n'));
      const post = doc.context.register(doc.context.flateStream('Q\n'.repeat(depth + 1)));
      page.node.set(L.PDFName.of('Contents'), doc.context.obj([pre, ...list, post, stream]));
    }
  }

  function newContext(L, doc, opts) {
    const fontObjs = {};
    return {
      fc: makeFontCache(L, doc),
      uni: makeUniDrawer(L, doc, (opts && opts.loadFont) || (async () => null)),
      font: async (name) => (fontObjs[name] = fontObjs[name] || await doc.embedFont(name)),
      embedImg: async (file) => file.type === 'png' ? doc.embedPng(file.bytes) : doc.embedJpg(file.bytes),
      report: { pages: {}, coveredOnly: 0, wholeLine: 0, reused: 0, unicode: 0, missingChars: new Set() }
    };
  }
  const hasEdits = (pe) => pe && ((pe.text || []).length || (pe.blocks || []).length || (pe.graphics || []).length || (pe.images || []).length || (pe.addText || []).length || (pe.addImages || []).length);

  /* Edits on one document, pages unchanged. pages: { [pageIndex]: pageEdits } */
  async function exportPdf(L, srcBytes, pages, opts) {
    const doc = await L.PDFDocument.load(srcBytes, { updateMetadata: false });
    const ctx = newContext(L, doc, opts);
    const all = doc.getPages();
    for (const key of Object.keys(pages)) {
      const pi = +key;
      if (!all[pi] || !hasEdits(pages[key])) continue;
      await applyPageEdits(L, doc, all[pi], pi, pages[key], ctx);
    }
    ctx.uni.finish();
    const bytes = await doc.save({ useObjectStreams: false });
    ctx.report.missingChars = Array.from(ctx.report.missingChars);
    return { bytes, report: ctx.report };
  }

  /* ---------- removing unreachable objects ---------- */
  function collectGarbage(L, doc) {
    const ctx = doc.context, seen = new Set();
    const stack = [];
    const ti = ctx.trailerInfo;
    [ti.Root, ti.Info].forEach(r => { if (r) stack.push(r); });
    while (stack.length) {
      const o = stack.pop();
      if (o instanceof L.PDFRef) {
        const k = o.toString();
        if (seen.has(k)) continue;
        seen.add(k);
        const v = ctx.lookup(o);
        if (v) stack.push(v);
      } else if (o instanceof L.PDFDict) {
        for (const [, v] of o.entries()) stack.push(v);
      } else if (o instanceof L.PDFArray) {
        for (let i = 0; i < o.size(); i++) stack.push(o.get(i));
      } else if (o && o.dict instanceof L.PDFDict) {
        stack.push(o.dict);
      }
    }
    let removed = 0;
    for (const [ref] of ctx.enumerateIndirectObjects()) if (!seen.has(ref.toString())) { ctx.delete(ref); removed++; }
    return removed;
  }

  /*
   * Build a document from pages of one or more PDFs, then apply edits.
   *   sources: { [sid]: Uint8Array }, primary: sid whose metadata, bookmarks and forms are kept
   *   order:   [{ sid, idx, rot, blank:{w,h} }]  (rot is added to the page's own rotation)
   *   edits:   array aligned with order (pageEdits or null)
   */
  async function buildDocument(L, input, opts) {
    opts = opts || {};
    const { sources, order } = input;
    const primary = input.primary in sources ? input.primary : Object.keys(sources)[0];
    const doc = primary != null ? await L.PDFDocument.load(sources[primary], { updateMetadata: false }) : await L.PDFDocument.create();
    const docs = { [primary]: doc };
    for (const e of order) if (!e.blank && !docs[e.sid]) docs[e.sid] = await L.PDFDocument.load(sources[e.sid], { updateMetadata: false });
    const orig = primary != null ? doc.getPages() : [];
    const used = new Set();
    const pages = [];
    // pass 1: gather pages (copies before any rotation is changed)
    for (const e of order) {
      if (e.blank) { pages.push(doc.addPage([e.blank.w, e.blank.h])); continue; }
      if (e.sid === primary && !used.has(e.idx) && orig[e.idx]) { used.add(e.idx); pages.push(orig[e.idx]); continue; }
      const [cp] = await doc.copyPages(docs[e.sid], [e.idx]);
      pages.push(cp);
    }
    // pass 2: rotation
    order.forEach((e, i) => { if (e.rot) pages[i].setRotation(L.degrees(((pages[i].getRotation().angle + e.rot) % 360 + 360) % 360)); });
    // rebuild the page tree in the new order
    for (let i = doc.getPageCount() - 1; i >= 0; i--) doc.removePage(i);
    pages.forEach((p, i) => doc.insertPage(i, p));
    // pages that were dropped: empty them so their content can't survive in the file
    orig.forEach((p, i) => {
      if (used.has(i)) return;
      p.node.set(L.PDFName.of('Contents'), doc.context.obj([]));
      p.node.delete(L.PDFName.of('Annots'));
      p.node.set(L.PDFName.of('Resources'), doc.context.obj({}));
    });
    const ctx = newContext(L, doc, opts);
    const edits = input.edits || [];
    for (let i = 0; i < pages.length; i++) if (hasEdits(edits[i])) await applyPageEdits(L, doc, pages[i], i, edits[i], ctx);
    if (opts.watermark && opts.watermark.text) {
      const on = pageSet(opts.watermark.pages, pages.length);
      for (let i = 0; i < pages.length; i++) if (on.has(i)) await applyWatermark(L, doc, pages[i], opts.watermark, ctx);
      ctx.report.watermarked = on.size;
    }
    ctx.uni.finish();
    if (opts.gc !== false) ctx.report.garbage = collectGarbage(L, doc);
    const bytes = await doc.save({ useObjectStreams: false });
    ctx.report.missingChars = Array.from(ctx.report.missingChars);
    return { bytes, report: ctx.report };
  }

  /*
   * Fast build for on-screen previews: a new file holding only the pages asked for, copied from
   * already-open source documents (which are left untouched), so the cost follows the edited pages
   * rather than the size of the whole PDF.
   */
  async function buildPreview(L, input, opts) {
    opts = opts || {};
    const out = await L.PDFDocument.create({ updateMetadata: false });
    const pages = [];
    for (const e of input.order) {
      if (e.blank) { pages.push(out.addPage([e.blank.w, e.blank.h])); continue; }
      const [cp] = await out.copyPages(input.docs[e.sid], [e.idx]);
      out.addPage(cp); pages.push(cp);
    }
    input.order.forEach((e, i) => { if (e.rot) pages[i].setRotation(L.degrees(((pages[i].getRotation().angle + e.rot) % 360 + 360) % 360)); });
    const ctx = newContext(L, out, opts);
    const edits = input.edits || [];
    for (let i = 0; i < pages.length; i++) if (hasEdits(edits[i])) await applyPageEdits(L, out, pages[i], i, edits[i], ctx);
    ctx.uni.finish();
    const bytes = await out.save({ useObjectStreams: false, addDefaultPage: false });
    ctx.report.missingChars = Array.from(ctx.report.missingChars);

      $('#desk').scrollTop = D.div.offsetTop + (ev.clientY - r.top) - $('#desk').clientHeight / 2;
    });
    SPL.dom[e.id] = { div, cv, busy };
    host.append(div); lio.observe(div);
  });
  sc.scrollTop = frac * sc.scrollHeight;
  updateLowerLabel();
}
async function renderLower(eid, force) {
  const e = entry(eid), D = SPL.dom[eid]; if (!e || !D) return;
  const sig = (S.previewSig[eid] || '') + '@' + S.zoom;
  if (!force && SPL.rendered[eid] === sig) return;
  SPL.rendered[eid] = sig;
  try {
    const res = await drawEntry(e, S.zoom);
    if (!res || SPL.dom[eid] !== D || SPL.rendered[eid] !== sig) return;
    res.cv.style.width = '100%'; res.cv.style.height = '100%';
    D.cv.replaceWith(res.cv); D.cv = res.cv; D.busy.hidden = true;
  } catch (err) { if (!/cancel/i.test(String(err))) console.warn(err); }
}
function refreshLower() {
  if (!SPL.on) return;
  S.order.forEach(e => { const want = (S.previewSig[e.id] || '') + '@' + S.zoom; if (SPL.rendered[e.id] !== undefined && SPL.rendered[e.id] !== want) renderLower(e.id, true); });
}
function updateLowerLabel() {
  if (!SPL.on) return;
  const sc = $('#lowerScroll'), mid = sc.scrollTop + sc.clientHeight * 0.3;
  let n = 0;
  S.order.forEach((e, i) => { const D = SPL.dom[e.id]; if (D && D.div.offsetTop <= mid) n = i; });
  $('#lowerPage').textContent = 'Page ' + (n + 1) + ' of ' + S.order.length;
}
$('#lowerScroll').addEventListener('scroll', updateLowerLabel, { passive: true });
$('#lowerClose').onclick = () => closeSplit(false);
/* the grip at the top of the document: drag down to split */
(function () {
  const grip = $('#splitGrip'), bar = $('#hsplit');
  const guide = () => { let g = $('#splitGuide'); if (!g) { g = el('div'); g.id = 'splitGuide'; leftCol().append(g); } return g; };
  grip.addEventListener('pointerdown', (ev) => {
    if (SPL.on) return;
    ev.preventDefault(); grip.setPointerCapture(ev.pointerId);
    const col = leftCol().getBoundingClientRect();
    const g = guide(); g.hidden = false;
    const move = (m) => { const y = Math.max(0, Math.min(col.height, m.clientY - col.top)); g.style.top = y + 'px'; };
    const up = (u) => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      g.hidden = true;
      const y = u.clientY - col.top - grip.offsetHeight;
      if (u.type === 'pointerup' && Math.abs(u.clientY - ev.clientY) > 30) openSplit(y);
    };
    move(ev);
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
  const half = () => openSplit(($('#desk').clientHeight - 10) / 2);
  grip.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowDown') { ev.preventDefault(); if (SPL.on) closeSplit(false); else half(); } });
  grip.addEventListener('dblclick', () => { if (SPL.on) closeSplit(false); else half(); });
  // the bar between the two views: drag to resize, drag to an edge or double-click to close
  bar.addEventListener('pointerdown', (ev) => {
    ev.preventDefault(); bar.setPointerCapture(ev.pointerId);
    const col = leftCol().getBoundingClientRect();
    const move = (m) => { const h = col.bottom - m.clientY; leftCol().style.setProperty('--lower-h', Math.max(0, Math.min(col.height - 30, h)) + 'px'); };
    const up = (u) => {
      bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up);
      const h = col.bottom - u.clientY;
      if (h < 70) closeSplit(false);
      else if (u.clientY - col.top < 90) closeSplit(true);
    };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up);
  });
  bar.addEventListener('dblclick', () => closeSplit(false));
  bar.addEventListener('keydown', (ev) => {
    const cur = $('#lower').getBoundingClientRect().height;
    if (ev.key === 'ArrowUp') { ev.preventDefault(); leftCol().style.setProperty('--lower-h', (cur + 40) + 'px'); }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); if (cur - 40 < 70) closeSplit(false); else leftCol().style.setProperty('--lower-h', (cur - 40) + 'px'); }
    if (ev.key === 'Enter' || ev.key === 'Escape') { ev.preventDefault(); closeSplit(false); }
  });
})();

/* ---------------- theme ---------------- */
const THEME_ICON = {
  moon: '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
  sun: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>'
};
const effectiveTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = effectiveTheme() === 'dark', b = $('#theme');
  b.innerHTML = dark ? THEME_ICON.sun : THEME_ICON.moon;
  b.title = dark ? 'Switch to light theme' : 'Switch to dark theme'; b.setAttribute('aria-label', b.title);
}
$('#theme').onclick = () => { const t = effectiveTheme() === 'dark' ? 'light' : 'dark'; applyTheme(t); try { localStorage.setItem('folio.theme', t); } catch (err) {} };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(document.documentElement.dataset.theme));
try { applyTheme(localStorage.getItem('folio.theme')); } catch (err) { applyTheme(null); }

/* ---------------- side panels: show or hide ---------------- */
function setPane(which, show, quiet) {
  const cls = which === 'rail' ? 'hide-rail' : 'hide-insp';
  document.body.classList.toggle(cls, !show);
  const b = $(which === 'rail' ? '#railTab' : '#inspTab');
  const label = which === 'rail' ? (show ? 'Hide the tools' : 'Show the tools') : (show ? 'Hide the side panel' : 'Show the side panel');
  b.setAttribute('aria-label', label); b.title = label + (which === 'rail' ? ' ([)' : ' (])');
  b.classList.toggle('closed', !show);
  try { localStorage.setItem('folio.' + which, show ? '1' : '0'); } catch (err) {}
  placeTabs();
  // the page area changed size: keep "fit" zoom fitting
  if (!quiet) window.dispatchEvent(new Event('resize'));
}
const paneShown = (which) => !document.body.classList.contains(which === 'rail' ? 'hide-rail' : 'hide-insp');
/* the tabs sit on the inner edge of each side bar, halfway down, and stay at the edge when the bar is hidden */
function placeTabs() {
  const work = document.querySelector('.work'), W = work.getBoundingClientRect();
  const left = [...document.querySelectorAll('.rail, #thumbs')].filter(n => n.offsetParent && n.getBoundingClientRect().width > 0).reduce((m, n) => Math.max(m, n.getBoundingClientRect().right), W.left);
  const insp = $('#inspector'), ir = insp.getBoundingClientRect();
  const right = insp.offsetParent && ir.width > 0 ? ir.left : W.right;
  const lt = $('#railTab'), rt = $('#inspTab'), top = (W.height / 2 - 22) + 'px';
  lt.style.left = (left - W.left) + 'px'; lt.style.top = top;
  rt.style.left = (right - W.left - rt.offsetWidth) + 'px'; rt.style.top = top;
  rt.hidden = document.querySelector('.work').classList.contains('reading') && paneShown('insp');
}
$('#railTab').onclick = () => setPane('rail', !paneShown('rail'));
$('#inspTab').onclick = () => setPane('insp', !paneShown('insp'));
try { new ResizeObserver(() => placeTabs()).observe(document.querySelector('.work')); ['.rail', '#thumbs', '#inspector'].forEach(sel => new ResizeObserver(() => placeTabs()).observe(document.querySelector(sel))); } catch (err) { window.addEventListener('resize', placeTabs); }
new MutationObserver(() => placeTabs()).observe(document.querySelector('.work'), { attributes: true, attributeFilter: ['class'] });
try { ['rail', 'insp'].forEach(w => { if (localStorage.getItem('folio.' + w) === '0') setPane(w, false, true); }); } catch (err) {}

/* ---------------- no document: start screen ---------------- */
function updateChrome() {
  const has = !!S.primary;
  document.body.classList.toggle('no-doc', !has);
  $('#start').hidden = has;
  ['#save', '#word', '#closeDoc', '#tView', '#tEdit', '#tText', '#tImg', '#tWm', '#tProtect', '#tPages', '#tCompare', '#tThumbs', '#pgPrev', '#pgNext', '#pgNum', '#zIn', '#zOut', '#zSel'].forEach(id => { const n = $(id); if (n) n.disabled = !has; });
  if (has && S.view === 'pages') { $('#zIn').disabled = $('#zOut').disabled = $('#zSel').disabled = true; }
  if (has) updatePageNav(); else { $('#pgNum').value = ''; $('#pgCount').textContent = ''; }
}
async function closePdf() {
  if (!S.primary) return;
  if (hasChanges()) {
    const ok = await modal({ title: 'Close ' + S.name + '?', text: 'Your changes haven\'t been downloaded and will be lost.', buttons: [{ label: 'Cancel', value: false }, { label: 'Close without saving', value: true, primary: true, danger: true }] });
    if (!ok) return;
  }
  closeInline(false); closeMenu();
  if (CMP.on) await setCompare(false);
  if (SPL.on) closeSplit(false);
  if (S.view !== 'edit') setView('edit');
  Object.values(S.sources).forEach(s => { try { s.view.destroy(); } catch (e) {} });
  if (S.preview) { try { S.preview.destroy(); } catch (e) {} }
  Object.assign(S, { sources: {}, primary: null, name: '', order: [], sel: null, undo: [], redo: [], rendered: {}, files: {}, preview: null, previewIndex: {}, previewSig: {}, lastReport: null, pick: new Set(), initialOrder: '', userZoomed: false, zoomMode: null });
  S.edits = { text: {}, blocks: {}, gfx: {}, images: {}, addText: [], addImages: [], watermark: null };
  S.protect = protectDefaults(); S.pdraft = null; updateSaveButton();
  CMP.leftCache = {};
  $('#docName').textContent = ''; $('#fileIn').value = '';
  await buildPages();
  updateUndo(); renderInspector(); updateChrome();
  $('#startOpen').focus();
}
$('#closeDoc').onclick = closePdf;
/* where files go: explained in plain terms */
function showLocalInfo() {
  const back = el('div', 'modal-back');
  const box = el('div', 'modal local-info'); box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'liTitle');
  const h = el('h3', null, 'Your PDF stays on this device'); h.id = 'liTitle';
  box.append(h);
  const items = [
    ['Opened in this tab only', 'When you open a PDF, your browser reads it into this tab\'s memory. It is not uploaded to any server, including the one this page came from.'],
    ['Nothing is kept', 'Folio doesn\'t save your files in the browser. Closing the PDF, reloading or closing the tab clears it. Only your theme and sidebar choices are remembered.'],
    ['Saving is up to you', 'Download and Export to Word create a new file on your computer, in your downloads folder. The original file is never changed.'],
    ['What the page loads', 'The app downloads its own code and fonts when the page opens. None of those requests carry your document.']
  ];
  const dl = el('dl', 'local-list');
  items.forEach(([t, d]) => { const w = el('div'); w.append(el('dt', null, t), el('dd', null, d)); dl.append(w); });
  box.append(dl);
  const acts = el('div', 'actions'); const ok = el('button', 'btn primary', 'Got it'); acts.append(ok); box.append(acts);
  const done = () => { back.remove(); $('#localInfo').focus(); };
  ok.onclick = done; back.addEventListener('click', (e) => { if (e.target === back) done(); });
  back.addEventListener('keydown', (e) => { if (e.key === 'Escape') done(); });
  back.append(box); document.body.append(back); setTimeout(() => ok.focus(), 20);
}
$('#localInfo').onclick = showLocalInfo;
$('#startOpen').onclick = () => { $('#fileIn').value = ''; $('#fileIn').click(); };
if (/Mac|iP/.test(navigator.platform || navigator.userAgent)) $('#startMod').textContent = '⌘';

S.protect = protectDefaults(); updateSaveButton();
renderInspector();
updateChrome();
ensurePdfjs().catch((err) => { console.error(err); status(''); toast('The viewer could not load. Check your connection and reload.'); });
window.__folio = S;
