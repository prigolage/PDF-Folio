<script type="module">
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const L = window.PDFLib, E = window.PDFEngine, C = window.PDFCrypto;
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);
const toHex = (c) => '#' + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
const fromHex = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
const uid = () => Math.random().toString(36).slice(2, 9);
let toastT;
function toast(msg, ms = 3400) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }
function status(msg) { $('#status').textContent = msg || ''; }

/* ---------------- state ---------------- */
let pdfjs = null;
const S = {
  sources: {},       // sid -> { name, bytes, view, lib, fc, pages:[pdfjs page], items:[], an:[] }
  primary: null, name: '',
  order: [],         // [{ id, sid, idx, rot, blank:{w,h} }]
  edits: { text: {}, blocks: {}, gfx: {}, images: {}, addText: [], addImages: [] },
  files: {},         // image files by id
  zoom: 1, mode: 'view', view: 'edit', sample: false,
  sel: null, pick: new Set(), undo: [], redo: [],
  dom: {}, rendered: {}, preview: null, previewIndex: {}, previewSig: {}, lastReport: null, initialOrder: '',
  blankPages: {}, fontBytes: {}
};
const entry = (eid) => S.order.find(e => e.id === eid);
const entryIndex = (eid) => S.order.findIndex(e => e.id === eid);

/* ---------------- pdf.js ---------------- */
let pdfjsLoading = null;
function ensurePdfjs() {
  // one shared load, so opening a file while the viewer is still loading waits for all of it
  if (!pdfjsLoading) pdfjsLoading = (async () => {
    status('Loading viewer…');
    const lib = await import(PDFJS);
    // run pdf.js in the page itself: cross-origin worker scripts are not allowed here
    globalThis.pdfjsWorker = await import(PDFJS_WORKER);
    lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    pdfjs = lib;
    status('');
    return lib;
  })().catch((err) => { pdfjsLoading = null; status(''); throw err; });
  return pdfjsLoading;
}
const openView = (bytes) => pdfjs.getDocument({ data: bytes.slice(), isEvalSupported: false, useSystemFonts: true }).promise;

/* fonts for characters outside the standard PDF fonts, fetched only when used */
async function loadFont(kind) {
  if (S.fontBytes[kind]) return S.fontBytes[kind];
  status(kind.startsWith('cjk') ? 'Loading CJK font…' : 'Loading font…');
  try {
    const r = await fetch('fonts/' + kind + '.ttf');
    if (!r.ok) throw new Error(r.status);
    S.fontBytes[kind] = new Uint8Array(await r.arrayBuffer());
  } catch (e) { S.fontBytes[kind] = null; }
  status('');
  return S.fontBytes[kind];
}

/* ---------------- modal ---------------- */
function modal({ title, text, input, buttons }) {
  return new Promise((resolve) => {
    const back = el('div', 'modal-back');
    const box = el('div', 'modal'); box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
    box.append(el('h3', null, title));
    if (text) box.append(el('p', null, text));
    let inp = null, err = null;
    const form = el('form');
    form.style.display = 'flex'; form.style.flexDirection = 'column'; form.style.gap = '14px';
    if (input) { inp = el('input'); inp.type = 'password'; inp.id = 'mPw'; inp.autocomplete = 'off'; inp.setAttribute('aria-label', input); inp.placeholder = input; form.append(inp); err = el('p', 'err'); err.hidden = true; form.append(err); }
    const acts = el('div', 'actions');
    buttons.forEach((b, i) => {
      const btn = el('button', 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''), b.label);
      btn.type = b.primary ? 'submit' : 'button';
      if (!b.primary) btn.onclick = () => done(b.value);
      acts.append(btn);
    });
    form.append(acts); box.append(form);
    form.addEventListener('submit', (e) => { e.preventDefault(); done(buttons.find(b => b.primary).value); });
    back.addEventListener('keydown', (e) => { if (e.key === 'Escape') done(null); });
    const done = (v) => { back.remove(); resolve(input ? (v ? inp.value : null) : v); };
    back.append(box); document.body.append(back);
    setTimeout(() => (inp || acts.querySelector('.primary') || acts.firstChild).focus(), 20);
    back.showError = (m) => { err.textContent = m; err.hidden = false; };
  });
}

/* ---------------- opening files ---------------- */
async function readPdf(bytes, name) {
  // returns decrypted bytes or null if the person cancelled
  let pw = '', wrongOnce = false;
  for (;;) {
    let r;
    try { r = await C.decryptPdf(L, bytes, pw); }
    catch (e) {
      if (e && e.code === 'password') {
        pw = await modal({ title: (wrongOnce ? 'Wrong password' : 'Password required'), text: (wrongOnce ? 'That password didn\'t open ' : '') + (wrongOnce ? name + '. Try again.' : name + ' is protected. Enter its password to open it.'), input: 'Password', buttons: [{ label: 'Cancel', value: false }, { label: 'Open', value: true, primary: true }] });
        if (pw == null) return null;
        wrongOnce = true; continue;
      }
      if (e && e.code === 'unsupported') { toast(e.message, 6000); return null; }
      toast("This file couldn't be read as a PDF."); return null;
    }
    if (r.restricted) {
      const ok = await modal({ title: 'Editing is restricted', text: 'The author of ' + name + ' turned off editing for this file. Continue only if you have permission to change it. The saved copy will not keep the restriction.', buttons: [{ label: 'Cancel', value: false }, { label: 'Continue', value: true, primary: true }] });
      if (!ok) return null;
    }
    return r.bytes instanceof Uint8Array ? r.bytes : new Uint8Array(r.bytes);
  }
}
async function addSource(bytes, name) {
  await ensurePdfjs();
  const plain = await readPdf(bytes, name);
  if (!plain) return null;
  let lib, view;
  try { lib = await L.PDFDocument.load(plain, { updateMetadata: false }); } catch (e) { toast("This file couldn't be read as a PDF."); return null; }
  try { view = await openView(plain); } catch (e) { toast("This PDF couldn't be displayed."); return null; }
  const sid = uid();
  const src = { sid, name, bytes: plain, lib, view, fc: E.makeFontCache(L, lib), pages: [], items: [], an: [], bl: [], gx: [] };
  for (let i = 0; i < view.numPages; i++) src.pages.push(await view.getPage(i + 1));
  S.sources[sid] = src;
  return src;
}
async function openPdf(bytes, name, isSample) {
  if (S.primary && hasChanges()) {
    const ok = await modal({ title: 'Open a different PDF?', text: 'Your changes to ' + S.name + ' haven\'t been downloaded and will be lost.', buttons: [{ label: 'Cancel', value: false }, { label: 'Open anyway', value: true, primary: true }] });
    if (!ok) return;
  }
  const src = await addSource(bytes, name);
  if (!src) return;
  Object.values(S.sources).forEach(s => { if (s !== src) { try { s.view.destroy(); } catch (e) {} } });
  S.sources = { [src.sid]: src };
  Object.assign(S, { primary: src.sid, name, sample: !!isSample, sel: null, undo: [], redo: [], rendered: {}, files: {}, previewIndex: {}, previewSig: {}, lastReport: null });
  if (S.preview) { try { S.preview.destroy(); } catch (e) {} S.preview = null; }
  S.pick = new Set();
  S.edits = { text: {}, blocks: {}, gfx: {}, images: {}, addText: [], addImages: [] };
  S.order = src.pages.map((p, i) => ({ id: uid(), sid: src.sid, idx: i, rot: 0 }));
  S.initialOrder = orderSig();
  updateDocName();
  fitZoom();
  if (S.view !== 'edit') setView('edit');
  CMP.leftCache = {};
  if (CMP.on) setCmpSource(CMP.mode === 'other' ? 'other' : CMP.mode, null, true);
  rebuildAll();
  updateUndo();
  updateChrome();
}
function updateDocName() { const n = S.order.length, d = $('#docName'); d.textContent = ''; d.title = S.name; d.append(el('span', 'fn', S.name), el('span', 'pc', n + (n === 1 ? ' page' : ' pages'))); }
const orderSig = () => S.order.map(e => e.blank ? 'b' : e.sid + ':' + e.idx + ':' + (e.rot || 0)).join(',');
const hasChanges = () => editCount() > 0 || orderSig() !== S.initialOrder;

/* ---------------- per-page data ---------------- */
function analysis(e) {
  if (e.blank) return { runs: [], images: [], streams: [] };
  const s = S.sources[e.sid];
  if (!s.an[e.idx]) { try { s.an[e.idx] = E.analyzePage(L, s.lib, e.idx, s.fc, { paths: true }); } catch (err) { console.warn(err); s.an[e.idx] = { runs: [], images: [], streams: [], shapes: [] }; } }
  return s.an[e.idx];
}
/* paragraphs and lines as people see them; block i of a page is keyed `${eid}|b${i}` */
function blocksOf(e) {
  if (e.blank) return [];
  const s = S.sources[e.sid];
  if (!s.bl[e.idx]) { try { s.bl[e.idx] = E.buildBlocks(analysis(e)); } catch (err) { console.warn(err); s.bl[e.idx] = []; } }
  return s.bl[e.idx];
}
const blockKey = (e, b) => e.id + '|b' + b.index;
function blockByKey(key) {
  const [eid, k] = key.split('|b'); const e = entry(eid); if (!e) return null;
  const b = blocksOf(e)[+k]; return b ? { e, b } : null;
}
function uiMeasure(t, st) { return E.unsupportedChars(L, t).length ? [...t].reduce((a, c) => a + (/[\u1100-\uFFDC]/.test(c) ? 0.92 : 0.56), 0) * st.size : E.measureStd(L, t, st); }
function blockStyleOf(an, b, li) { const u = b.units.find(x => x.line === li && x.ri != null) || b.units.find(x => x.ri != null); return E.styleFromRun(u ? an.runs[u.ri] : null, b.size); }
const growCache = new Map();
/* where a block is now: its original box, moved, and grown or shrunk when the text rewraps */
function blockRect(e, b) {
  const ed = S.edits.blocks[blockKey(e, b)];
  const r = { ...b.bbox };
  if (!ed) return r;
  if (ed.width != null && Math.abs(b.angle) < 0.01) r.w = ed.width;
  if (ed.newText != null && (ed.newText !== b.text || ed.style || ed.width != null)) {
    const sig = blockKey(e, b) + '|' + ed.newText + '|' + JSON.stringify(ed.style) + '|' + !!ed.move + '|' + ed.width;
    if (!growCache.has(sig)) {
      let lines = b.lines.length;
      try { const an = analysis(e); const p = E.planBlockEdit(an, b, { newText: ed.newText, style: ed.style, move: ed.move, width: ed.width }, { measure: uiMeasure, styleOf: (bb, li) => blockStyleOf(an, bb, li) }); if (p.mode === 'reflow') lines = p.lines; } catch (err) { console.warn(err); }
      growCache.set(sig, lines);
    }
    const extra = (growCache.get(sig) - b.lines.length) * b.gap;
    if (!ed.newText) { r.h = Math.max(r.h, 4); }
    else if (Math.abs(b.angle) < 0.01 && extra) { r.y -= extra; r.h += extra; }
  }
  if (ed.move) { r.x += ed.move.dx; r.y += ed.move.dy; }
  return r;
}
function blockStyle(e, b) {
  const an = analysis(e); const st = blockStyleOf(an, b, 0);
  const u = b.units.find(x => x.ri != null); const run = u ? an.runs[u.ri] : null;
  return { ...st, size: Math.round(st.size * 10) / 10, baseFont: run ? run.baseFont : '', inForm: !!(run && run.si) };
}
async function textItems(e) {
  if (e.blank) return [];
  const s = S.sources[e.sid];
  if (!s.items[e.idx]) {
    const tc = await s.pages[e.idx].getTextContent();

    const work = $('.work').getBoundingClientRect(), insp = $('#inspector').getBoundingClientRect();
    const move = (m) => {
      if (vertical()) { const h = work.bottom - m.clientY; $('.work').style.setProperty('--cmp-h', Math.max(120, Math.min(work.height - 120, h)) + 'px'); }
      else { const right = matchMedia('(max-width: 860px)').matches ? work.right : insp.left; const w = right - m.clientX; $('.work').style.setProperty('--cmp-w', Math.max(220, Math.min(work.width - 320, w)) + 'px'); }
    };
    const up = () => { sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); refit(); };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
  });
  sp.addEventListener('keydown', (ev) => {
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(ev.key)) return;
    ev.preventDefault();
    const w = $('#compare').getBoundingClientRect();
    if (vertical()) $('.work').style.setProperty('--cmp-h', (w.height + (ev.key === 'ArrowUp' ? 40 : ev.key === 'ArrowDown' ? -40 : 0)) + 'px');
    else $('.work').style.setProperty('--cmp-w', (w.width + (ev.key === 'ArrowLeft' ? 40 : ev.key === 'ArrowRight' ? -40 : 0)) + 'px');
    refit();
  });
})();
$('#tCompare').onclick = () => setCompare(!CMP.on);
$('#cmpClose').onclick = () => setCompare(false);
$('#cmpSrc').onchange = () => setCmpSource($('#cmpSrc').value);
$('#cmpIn').addEventListener('change', () => { const f = $('#cmpIn').files[0]; if (f) setCmpSource('other', f); });
$('#cmpOther').onclick = () => { $('#cmpIn').value = ''; $('#cmpIn').click(); };
$('#cmpSync').onchange = () => { CMP.sync = $('#cmpSync').checked; if (CMP.sync) syncFrom('left'); };
$('#cmpDiff').onchange = () => { CMP.diff = $('#cmpDiff').checked; CMP.result = null; drawDiffs(); refreshDiffs(); };
$('#cmpPrev').onclick = () => gotoHunk(-1);
$('#cmpNext').onclick = () => gotoHunk(1);

/* ---------------- split view: two scroll positions in the same document ---------------- */
const SPL = { on: false, dom: {}, rendered: {} };
let lio = null;
const leftCol = () => $('#leftCol');
function openSplit(topH) {
  const col = leftCol().getBoundingClientRect();
  const grip = $('#splitGrip').offsetHeight, bar = 10;
  const lowerH = Math.round(col.height - grip - topH - bar);
  if (lowerH < 80 || topH < 80) return;
  const desk = $('#desk');
  const startAt = desk.scrollTop + topH;
  leftCol().style.setProperty('--lower-h', lowerH + 'px');
  SPL.on = true;
  $('#hsplit').hidden = false; $('#lower').hidden = false;
  $('#splitGrip').setAttribute('aria-expanded', 'true');
  buildLower();
  // the lower view continues where the upper one leaves off
  $('#lowerScroll').scrollTop = startAt;
  updateLowerLabel();
}
function closeSplit(keepLower) {
  if (!SPL.on) return;
  if (keepLower) $('#desk').scrollTop = $('#lowerScroll').scrollTop;
  SPL.on = false;
  $('#hsplit').hidden = true; $('#lower').hidden = true;
  $('#splitGrip').setAttribute('aria-expanded', 'false');
  if (lio) lio.disconnect();
  $('#lowerPages').textContent = ''; SPL.dom = {}; SPL.rendered = {};
}
function buildLower() {
  if (!SPL.on) return;
  const sc = $('#lowerScroll'), frac = sc.scrollTop / Math.max(1, sc.scrollHeight);
  const host = $('#lowerPages'); host.textContent = '';
  if (lio) lio.disconnect();
  lio = new IntersectionObserver((ents) => ents.forEach(en => { if (en.isIntersecting) renderLower(en.target.dataset.eid); }), { root: sc, rootMargin: '600px 0px' });
  SPL.dom = {}; SPL.rendered = {};
  // mirror the upper pane's spacing so both panes scroll through identical layouts
  const banner = $('#pages .banner');
  if (banner) { const sp = el('div'); sp.style.height = banner.offsetHeight + 'px'; sp.style.flex = 'none'; host.append(sp); }
  S.order.forEach((e, n) => {
    const vp = viewport(e);
    const div = el('div', 'page'); div.dataset.eid = e.id;
    div.style.width = vp.width + 'px'; div.style.height = vp.height + 'px';
    div.append(el('span', 'num', 'Page ' + (n + 1)));
    const busy = el('div', 'busy', 'Rendering…'); div.append(busy);
    const cv = el('canvas'); div.append(cv);
    div.title = 'Double-click to edit this spot in the upper view';
    div.addEventListener('dblclick', (ev) => {
      const r = div.getBoundingClientRect();
      const D = S.dom[e.id]; if (!D) return;
      $('#desk').scrollTop = D.div.offsetTop + (ev.clientY - r.top) - $('#desk').clientHeight / 2;
    });
    SPL.dom[e.id] = { div, cv, busy };
    host.append(div); lio.observe(div);
  });
  sc.scrollTop = frac * sc.scrollHeight;
  updateLowerLabel();
}
async function renderLower(eid, force) {
  const e = entry(eid), D = SPL.dom[eid]; if (!e || !D) return;
  const sig = (S.previewSig[eid] || '') + '@' + S.zoom;
  if (!force && SPL.rendered[eid] === sig) return;
  SPL.rendered[eid] = sig;
  try {
    const res = await drawEntry(e, S.zoom);
    if (!res || SPL.dom[eid] !== D || SPL.rendered[eid] !== sig) return;
    res.cv.style.width = '100%'; res.cv.style.height = '100%';
    D.cv.replaceWith(res.cv); D.cv = res.cv; D.busy.hidden = true;
  } catch (err) { if (!/cancel/i.test(String(err))) console.warn(err); }
}
function refreshLower() {
  if (!SPL.on) return;
  S.order.forEach(e => { const want = (S.previewSig[e.id] || '') + '@' + S.zoom; if (SPL.rendered[e.id] !== undefined && SPL.rendered[e.id] !== want) renderLower(e.id, true); });
}
function updateLowerLabel() {
  if (!SPL.on) return;
  const sc = $('#lowerScroll'), mid = sc.scrollTop + sc.clientHeight * 0.3;
  let n = 0;
  S.order.forEach((e, i) => { const D = SPL.dom[e.id]; if (D && D.div.offsetTop <= mid) n = i; });
  $('#lowerPage').textContent = 'Page ' + (n + 1) + ' of ' + S.order.length;
}
$('#lowerScroll').addEventListener('scroll', updateLowerLabel, { passive: true });
$('#lowerClose').onclick = () => closeSplit(false);
/* the grip at the top of the document: drag down to split */
(function () {
  const grip = $('#splitGrip'), bar = $('#hsplit');
  const guide = () => { let g = $('#splitGuide'); if (!g) { g = el('div'); g.id = 'splitGuide'; leftCol().append(g); } return g; };
  grip.addEventListener('pointerdown', (ev) => {
    if (SPL.on) return;
    ev.preventDefault(); grip.setPointerCapture(ev.pointerId);
    const col = leftCol().getBoundingClientRect();
    const g = guide(); g.hidden = false;
    const move = (m) => { const y = Math.max(0, Math.min(col.height, m.clientY - col.top)); g.style.top = y + 'px'; };
    const up = (u) => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      g.hidden = true;
      const y = u.clientY - col.top - grip.offsetHeight;
      if (u.type === 'pointerup' && Math.abs(u.clientY - ev.clientY) > 30) openSplit(y);
    };
    move(ev);
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
  const half = () => openSplit(($('#desk').clientHeight - 10) / 2);
  grip.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'ArrowDown') { ev.preventDefault(); if (SPL.on) closeSplit(false); else half(); } });
  grip.addEventListener('dblclick', () => { if (SPL.on) closeSplit(false); else half(); });
  // the bar between the two views: drag to resize, drag to an edge or double-click to close
  bar.addEventListener('pointerdown', (ev) => {
    ev.preventDefault(); bar.setPointerCapture(ev.pointerId);
    const col = leftCol().getBoundingClientRect();
    const move = (m) => { const h = col.bottom - m.clientY; leftCol().style.setProperty('--lower-h', Math.max(0, Math.min(col.height - 30, h)) + 'px'); };
    const up = (u) => {
      bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up);
      const h = col.bottom - u.clientY;
      if (h < 70) closeSplit(false);
      else if (u.clientY - col.top < 90) closeSplit(true);
    };
    bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up);
  });
  bar.addEventListener('dblclick', () => closeSplit(false));
  bar.addEventListener('keydown', (ev) => {
    const cur = $('#lower').getBoundingClientRect().height;
    if (ev.key === 'ArrowUp') { ev.preventDefault(); leftCol().style.setProperty('--lower-h', (cur + 40) + 'px'); }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); if (cur - 40 < 70) closeSplit(false); else leftCol().style.setProperty('--lower-h', (cur - 40) + 'px'); }
    if (ev.key === 'Enter' || ev.key === 'Escape') { ev.preventDefault(); closeSplit(false); }
  });
})();

/* ---------------- theme ---------------- */
const THEME_ICON = {
  moon: '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
  sun: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>'
};
const effectiveTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = effectiveTheme() === 'dark', b = $('#theme');
  b.innerHTML = dark ? THEME_ICON.sun : THEME_ICON.moon;
  b.title = dark ? 'Switch to light theme' : 'Switch to dark theme'; b.setAttribute('aria-label', b.title);
}
$('#theme').onclick = () => { const t = effectiveTheme() === 'dark' ? 'light' : 'dark'; applyTheme(t); try { localStorage.setItem('folio.theme', t); } catch (err) {} };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(document.documentElement.dataset.theme));
try { applyTheme(localStorage.getItem('folio.theme')); } catch (err) { applyTheme(null); }

/* ---------------- no document: start screen ---------------- */
function updateChrome() {
  const has = !!S.primary;
  document.body.classList.toggle('no-doc', !has);
  $('#start').hidden = has;
  ['#save', '#word', '#closeDoc', '#tView', '#tEdit', '#tText', '#tImg', '#tPages', '#tCompare', '#tThumbs', '#pgPrev', '#pgNext', '#pgNum', '#zIn', '#zOut', '#zSel'].forEach(id => { const n = $(id); if (n) n.disabled = !has; });
  if (has && S.view === 'pages') { $('#zIn').disabled = $('#zOut').disabled = $('#zSel').disabled = true; }
  if (has) updatePageNav(); else { $('#pgNum').value = ''; $('#pgCount').textContent = ''; }
}
async function closePdf() {
  if (!S.primary) return;
  if (hasChanges()) {
    const ok = await modal({ title: 'Close ' + S.name + '?', text: 'Your changes haven\'t been downloaded and will be lost.', buttons: [{ label: 'Cancel', value: false }, { label: 'Close without saving', value: true, primary: true, danger: true }] });
    if (!ok) return;
  }
  closeInline(false); closeMenu();
  if (CMP.on) await setCompare(false);
  if (SPL.on) closeSplit(false);
  if (S.view !== 'edit') setView('edit');
  Object.values(S.sources).forEach(s => { try { s.view.destroy(); } catch (e) {} });
  if (S.preview) { try { S.preview.destroy(); } catch (e) {} }
  Object.assign(S, { sources: {}, primary: null, name: '', order: [], sel: null, undo: [], redo: [], rendered: {}, files: {}, preview: null, previewIndex: {}, previewSig: {}, lastReport: null, pick: new Set(), initialOrder: '', userZoomed: false, zoomMode: null });
  S.edits = { text: {}, blocks: {}, gfx: {}, images: {}, addText: [], addImages: [] };
  CMP.leftCache = {};
  $('#docName').textContent = ''; $('#fileIn').value = '';
  await buildPages();
  updateUndo(); renderInspector(); updateChrome();
  $('#startOpen').focus();
}
$('#closeDoc').onclick = closePdf;
$('#startOpen').onclick = () => { $('#fileIn').value = ''; $('#fileIn').click(); };
if (/Mac|iP/.test(navigator.platform || navigator.userAgent)) $('#startMod').textContent = '⌘';

renderInspector();
updateChrome();
ensurePdfjs().catch((err) => { console.error(err); status(''); toast('The viewer could not load. Check your connection and reload.'); });
window.__folio = S;
</script>
